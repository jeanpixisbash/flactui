[package]
name = "flactui"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1.0.105"
crossterm = "0.29.0"
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "sync"] }
zbus = "6.5.0"
