name: release

# Builds the static musl binary and attaches it to the GitHub release.
# Replaces the previous manual upload (DELETE asset + POST via API).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with musl target
        run: |
          rustup toolchain install stable --target x86_64-unknown-linux-musl --profile minimal

      - name: Build (musl, static)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Smoke test the binary
        run: ./target/x86_64-unknown-linux-musl/release/flactui --version

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            target/x86_64-unknown-linux-musl/release/flactui#flactui-x86_64-linux-musl \
            --clobber --repo "$GITHUB_REPOSITORY"
